name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# All jobs only build, test, and upload artifacts -- none write repository contents, so the
# token is held to read-only. (Artifact upload uses the Actions API, not `contents`.)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Install Tesseract OCR
        # The OCR tests (and the #20/#21 page-geometry regression guards) no-op when the
        # `tesseract` binary is absent, so without this they pass without executing anything --
        # leaving OcrTool.cs at 0% coverage on new code and the regressions unguarded in CI.
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Extension unit tests
        # These had never run in CI, so extension/test/ was effectively unenforced.
        run: node --test "extension/test/**/*.test.mjs"
      - name: No interpolated innerHTML under extension/src (#74)
        # A dedicated step as well as a node --test case, so the failure message points straight
        # at the offending file:line rather than at an assertion.
        run: node scripts/check-innerhtml.mjs
      - name: Release-candidate version rule
        run: ./scripts/test-next-version.sh
      - name: Linux packaging tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm libarchive-tools zstd
      - name: Linux package registration guard
        # Builds the .deb/.rpm/Arch packages against a stub host payload and checks that each one
        # registers the native messaging host where browsers actually look. A broken registration
        # is invisible until someone installs the package -- the browser just says "Specified
        # native messaging host not found" -- so it is worth catching on every push rather than
        # at release time. The stub keeps this to a couple of seconds and needs no .NET SDK.
        run: ./scripts/test-package-scripts.sh
      - name: Build
        run: dotnet build --configuration Release
      - name: Test with coverage (gated at 90% line coverage)
        run: ./scripts/coverage.sh 90 --configuration Release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage-report/

  perf:
    # Performance guards: absolute-time budgets and algorithmic-scaling checks for the core
    # operations behind the editor. Budgets are generous backstops that catch gross regressions
    # (an accidental O(n²), a broken cache, a full-document reprocess) rather than micro-changes.
    # PDF_EDITOR_PERF_SLACK relaxes every budget uniformly to absorb the variance of shared CI
    # runners, so this stays a reliable signal, not a flaky gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build tests/PdfEditor.Perf.Tests --configuration Release
      - name: Performance guards
        run: dotnet test tests/PdfEditor.Perf.Tests --configuration Release --no-build
        env:
          PDF_EDITOR_PERF_SLACK: "3"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install e2e dependencies
        working-directory: e2e
        # --ignore-scripts: @playwright/test's postinstall would try to download browsers
        # itself; the dedicated "Install Playwright Chromium" step below does that instead.
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        working-directory: e2e
        # --no-install: the exact pinned version was just installed by `npm ci` above, so
        # this must resolve to that local binary and never fetch anything from the registry.
        run: npx --no-install playwright@1.61.1 install --with-deps chromium
      - name: Install Tesseract OCR and LibreOffice Writer
        # The host shells out to these for "Make searchable (OCR)" and for opening/merging Word
        # documents; tests/v3-import-ocr.spec.js drives both and checks what they produce.
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          tesseract-ocr tesseract-ocr-eng libreoffice-writer-nogui
      - name: Run Playwright suite (extension + native host)
        working-directory: e2e
        run: npx --no-install playwright@1.61.1 test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  package-install-e2e:
    # The one test that proves a user who installs the package ends up with a working editor.
    #
    # Every other e2e test registers the native host into a throwaway browser profile, which says
    # nothing about the packaged registration -- and a package that installs cleanly and is then
    # never found by the browser is exactly the bug this project shipped. So this job builds the
    # real .deb, installs it with dpkg, and drives the extension against whatever the package left
    # behind: no profile-local manifest, no locally built host.
    #
    # The .deb is the only one of the three Linux packages an Ubuntu runner can actually install;
    # the .rpm and Arch packages are checked structurally instead, by verify-linux-package.sh in
    # the `test` job, which reads the same manifest/path/permission invariants out of each archive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        # Extensions need the full browser, not the headless shell. Playwright's Chromium is an
        # unbranded build, so it reads /etc/chromium/native-messaging-hosts -- one of the
        # directories the package registers the host in.
        working-directory: e2e
        run: npx --no-install playwright@1.61.1 install --with-deps chromium
      - name: Build the .deb
        # Built here rather than in the suite's global setup so a packaging failure is reported as
        # a packaging failure. The suite picks it up via PDF_EDITOR_DEB.
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          EDGE_EXTENSION_ID: ${{ secrets.EDGE_EXTENSION_ID }}
        run: ./scripts/package-deb.sh dist
      - name: Install the package and run the extension against it
        working-directory: e2e
        # The suite's global setup installs the .deb (via sudo) and purges it again afterwards,
        # pass or fail.
        run: |
          deb="$(ls "$GITHUB_WORKSPACE"/dist/pdf-editor-host_*.deb)"
          PDF_EDITOR_DEB="$deb" npx --no-install playwright@1.61.1 test \
            --config playwright.package.config.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-package-install
          path: e2e/playwright-report/

  package-dry-run:
    # Proves the packaging pipeline (scripts/package-extension.sh and
    # scripts/package-bundle.sh, plus what they depend on -- generate-icons.py,
    # extension/manifest.json, the native host's self-contained publish) still produces
    # valid artifacts. These are the same scripts release-candidate.yml and
    # release-extension.yml invoke for real releases, but neither triggers on a PR, so
    # without this job a regression in packaging would only surface at release time.
    # The bundle is built for just one platform here to keep PR runs fast; the release
    # workflows build the full desktop matrix. Runs on every push and PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Package extension
        run: ./scripts/package-extension.sh dist
      - name: Package all-in-one bundle (linux-x64 only, smoke check for the release matrix)
        run: ./scripts/package-bundle.sh linux-x64 dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-editor-extension-dry-run
          path: dist/pdf-editor-extension-*.zip
          if-no-files-found: error
          retention-days: 7

  package-linux-installers-dry-run:
    # Proves the Linux host installers (scripts/package-deb.sh / package-rpm.sh / package-arch.sh)
    # still build. release-candidate.yml is the only workflow that builds them for real and it runs
    # solely on push to main, so without this job a broken packaging script would only surface after
    # merge on the RC run. Builds all three (.deb / .rpm / .pkg.tar.zst) on every push/PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Install Linux packaging tooling (rpm + Arch package format)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm libarchive-tools zstd
      - name: Build the Linux host installers (.deb / .rpm / Arch .pkg.tar.zst)
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          EDGE_EXTENSION_ID: ${{ secrets.EDGE_EXTENSION_ID }}
        run: |
          ./scripts/package-deb.sh dist
          ./scripts/package-rpm.sh dist
          ./scripts/package-arch.sh dist
      - name: Note how to use these dry-run packages
        # These artifacts pin the host to whichever extension IDs the build used (the
        # CHROME_EXTENSION_ID/EDGE_EXTENSION_ID secrets, else the committed scripts/extension-id.txt
        # and edge-extension-id.txt = the published Web Store IDs). Anyone downloading them to test
        # against a developer-mode/unpacked extension (a different ID) must re-register — spell that
        # out in the job summary so it isn't a mystery.
        run: |
          pinned="${CHROME_EXTENSION_ID:-$(tr -d '[:space:]' < scripts/extension-id.txt)}"
          pinned_edge="${EDGE_EXTENSION_ID:-$(tr -d '[:space:]' < scripts/edge-extension-id.txt)}"
          {
            echo "## Linux host installers (dry run)"
            echo "These \`.deb\`/\`.rpm\`/\`.pkg.tar.zst\` packages register the native host for the"
            echo "extension IDs **\`$pinned\`** (Chrome) and **\`$pinned_edge\`** (Edge) only."
            echo ""
            echo "To use them with a **developer-mode / unpacked** extension (which has a different"
            echo "ID), after installing the package run:"
            echo '```bash'
            echo "./scripts/install-host.sh <your-extension-id>"
            echo '```'
            echo "It writes a per-user manifest that overrides the package's. See the README's"
            echo "\"System-wide: the OS installer packages\" section for details."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          EDGE_EXTENSION_ID: ${{ secrets.EDGE_EXTENSION_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-editor-host-linux-installers-dry-run
          path: |
            dist/pdf-editor-host_*.deb
            dist/pdf-editor-host-*.rpm
            dist/pdf-editor-host-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  package-msi-dry-run:
    # Proves the Windows MSI build (installer/windows/PdfEditorHost.wxs + scripts/package-msi.ps1)
    # still compiles. An MSI can only be built on Windows and release-candidate.yml -- the only
    # workflow that builds it for real -- runs solely on push to main, so without this job a broken
    # .wxs (bad GUID, schema error, WiX version gotcha) would only surface *after* merge, on the RC
    # run. This runs the same script on every push/PR so those errors are caught at review time.
    # WiX is pinned to v5: v6+ require accepting the OSMF EULA, which can't be done non-interactively.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Install the WiX toolset
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the MSI
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          EDGE_EXTENSION_ID: ${{ secrets.EDGE_EXTENSION_ID }}
        run: ./scripts/package-msi.ps1 -OutputDir dist
        shell: pwsh
      - name: Verify the MSI registers the native messaging host
        # The Windows half of the check the Linux packages get from verify-linux-package.sh. A
        # broken registration is invisible until someone installs the MSI and tries it -- the
        # browser says "Specified native messaging host not found" whether the registry value is
        # missing, points at a manifest the package never shipped, or the manifest pins a different
        # extension. This reads the MSI's own tables and checks each of those.
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          EDGE_EXTENSION_ID: ${{ secrets.EDGE_EXTENSION_ID }}
        shell: pwsh
        run: |
          $id = $env:CHROME_EXTENSION_ID
          if (-not $id) { $id = (Get-Content scripts/extension-id.txt -Raw).Trim() }
          $edgeId = $env:EDGE_EXTENSION_ID
          if (-not $edgeId) { $edgeId = (Get-Content scripts/edge-extension-id.txt -Raw).Trim() }
          $msi = (Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          ./scripts/verify-msi.ps1 $msi -ExpectedExtensionId $id -ExpectedEdgeExtensionId $edgeId
      - name: Note how to use this dry-run package
        # Same caveat as the Linux dry-run job: the MSI pins the host to two extension IDs, so a
        # developer-mode/unpacked extension (a different ID) must re-register per-user afterward.
        shell: pwsh
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          EDGE_EXTENSION_ID: ${{ secrets.EDGE_EXTENSION_ID }}
        run: |
          $pinned = $env:CHROME_EXTENSION_ID
          if (-not $pinned) { $pinned = (Get-Content scripts/extension-id.txt -Raw).Trim() }
          $pinnedEdge = $env:EDGE_EXTENSION_ID
          if (-not $pinnedEdge) { $pinnedEdge = (Get-Content scripts/edge-extension-id.txt -Raw).Trim() }
          # Single-quoted lines so backticks/backslashes are literal markdown; only the ID lines
          # interpolate, via string concatenation, to avoid PowerShell backtick-escape surprises.
          $lines = @(
            '## Windows MSI (dry run)',
            'This `.msi` registers the native host for the extension IDs **`' + $pinned + '`** (Chrome) and **`' + $pinnedEdge + '`** (Edge) only.',
            '',
            'To use it with a **developer-mode / unpacked** extension (a different ID), after',
            'installing the MSI run the helper it puts next to the host:',
            '```powershell',
            '# Two roots: an MSI built before the -arch x64 fix was a 32-bit package, which',
            '# Windows Installer redirects to "C:\Program Files (x86)".',
            '$hostDir = "$env:ProgramFiles\PDF Editor Host","${env:ProgramFiles(x86)}\PDF Editor Host" |',
            '  Where-Object { Test-Path $_ } | Select-Object -First 1',
            'powershell -NoProfile -ExecutionPolicy Bypass -File `',
            '  "$hostDir\register-host.ps1" -ExtensionId <your-extension-id>',
            '```',
            'From a checkout, `.\scripts\install-host.ps1 -ExtensionId <your-extension-id>` does the',
            'same thing (and installs the host first).',
            '',
            "Either writes per-user (HKCU) keys that override the MSI's machine-wide ones. See the",
            'README''s "System-wide: the OS installer packages" section for details.'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-editor-host-msi-dry-run
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    # Builds the all-in-one bundle (browser extension + self-contained native host +
    # install scripts) for every desktop platform and uploads each as a downloadable
    # artifact, so any push/PR can be installed and tested end-to-end without a local
    # .NET SDK. Grab the one for your OS from this run's "Artifacts" section, unzip it,
    # load extension/ unpacked, and run the bundled install script (see INSTALL.md).
    # The four platforms build in parallel, so wall-clock time stays close to one build.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - name: Build all-in-one bundle (${{ matrix.rid }})
        run: ./scripts/package-bundle.sh "${{ matrix.rid }}" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-editor-bundle-${{ matrix.rid }}
          path: dist/pdf-editor-bundle-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 14
